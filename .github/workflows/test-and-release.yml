name: Test and Release

# Run the routine Linux gate on pushes and pull requests.
# Semantic-version tags and manual runs additionally execute the full OS matrix.
on:
    workflow_dispatch: {}
    push:
        branches:
            - 'main'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '22.x'
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  type-checking: true
                  lint: true

    # Routine adapter tests on the primary ioBroker deployment platform
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: check-and-lint

        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ubuntu-latest
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  build: true

    # Adds Windows and macOS for a complete 3 x 3 release/readiness matrix
    cross-platform-tests:
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        needs: check-and-lint

        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [windows-latest, macos-latest]

        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  # Uncomment the following line if your adapter cannot be installed using 'npm ci'
                  # install-command: 'npm install'
                  build: true

